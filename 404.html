<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — tronkilu.studio</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
@font-face{font-family:"Archivo";src:url("/assets/fonts/Archivo-latin.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap;unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}@font-face{font-family:"Archivo";src:url("/assets/fonts/Archivo-ext.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap;unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
:root{--paper:#fff;--ink-900:#000;--ink-500:#5e5e5e;--t-nav:20px}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;background:#F4F6F5;color:var(--ink-900);font-family:Archivo,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:24px 32px 24px 0;gap:24px}
.mark{font-size:var(--t-nav);font-weight:600;letter-spacing:-.03em;text-decoration:none;padding-left:32px}
.lang{display:flex;gap:16px}
.lang button{font-family:inherit;font-size:var(--t-nav);letter-spacing:-.02em;background:none;border:0;padding:0;color:inherit;cursor:pointer;font-weight:400;transition:font-weight 120ms cubic-bezier(.2,0,0,1),opacity 120ms cubic-bezier(.2,0,0,1)}
.lang button:hover{font-weight:600}
.lang button:active{opacity:.6}
.lang button[aria-pressed=true]{font-weight:600}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:64px 32px 64px 32px;max-width:900px}
.code{font-size:clamp(96px,22vw,260px);font-weight:600;letter-spacing:-.055em;line-height:.82}
h1{margin-top:32px;font-size:clamp(28px,4.4vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1.08}
p{margin-top:20px;font-size:18px;line-height:1.55;max-width:48ch;text-wrap:pretty}
.back{margin-top:36px;display:inline-flex;font-size:var(--t-nav);letter-spacing:-.02em;text-decoration:none;font-weight:400;transition:font-weight 120ms cubic-bezier(.2,0,0,1),opacity 120ms cubic-bezier(.2,0,0,1)}
.back::before{content:"[ ";opacity:0;transition:opacity 120ms cubic-bezier(.2,0,0,1)}
.back::after{content:" ]";opacity:0;transition:opacity 120ms cubic-bezier(.2,0,0,1)}
.back:hover{font-weight:600}
.back:hover::before,.back:hover::after{opacity:1}
.back:active{opacity:.6}
a{color:var(--ink-900)}
a:hover{text-decoration:none}
.foot{display:flex;justify-content:space-between;align-items:center;padding:48px 32px 48px 32px;font-size:14px;color:var(--ink-500);gap:24px;flex-wrap:wrap}
.foot a{color:var(--ink-900);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;white-space:nowrap}
@media(max-width:860px){main{padding-left:32px;padding-right:32px}}
</style>
</head>
<body>
<header class="topbar"><a class="mark" href="/">tronkilu.studio</a><div class="lang"><button type="button" data-lang="en" aria-pressed="true">en</button><button type="button" data-lang="fr" aria-pressed="false">fr</button><button type="button" data-lang="al" aria-pressed="false">al</button></div></header>
<main>
<span class="code">404</span>
<h1 id="h">This page does not exist</h1>
<p id="p">The link may be broken, or the page may have moved.</p>
<a class="back" href="/" id="back">Back to the homepage</a>
</main>
<div class="foot"><span id="copyrightLine">© 2026 Tronkilu Studio. All rights reserved.</span><span><a href="/legal/" id="legalLinkLabel">Legal notice</a></span></div>
<script>
const I18N={
h:{en:"This page does not exist",fr:"Cette page n'existe pas",al:"Kjo faqe nuk ekziston"},
p:{en:"The link may be broken, or the page may have moved.",fr:"Le lien est peut-être cassé, ou la page a été déplacée.",al:"Linku mund të jetë i thyer, ose faqja është zhvendosur."},
back:{en:"Back to the homepage",fr:"Retour à l'accueil",al:"Kthehu në faqen kryesore"},
copyrightLine:{en:"© 2026 Tronkilu Studio. All rights reserved.",fr:"© 2026 Tronkilu Studio. Tous droits réservés.",al:"© 2026 Tronkilu Studio. Të gjitha të drejtat e rezervuara."},
legalLinkLabel:{en:"Legal notice",fr:"Mentions légales",al:"Shënime ligjore"}
};
const HTML_LANG={en:"en",fr:"fr",al:"sq"};
function setLang(l){
Object.entries(I18N).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.textContent=v[l]});
document.documentElement.lang=HTML_LANG[l]||"en";
document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));
try{localStorage.setItem('tk-lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
let saved=null;try{saved=localStorage.getItem('tk-lang')}catch(e){}
setLang(saved||'en');
</script>
</body>
</html>
